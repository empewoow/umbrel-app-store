name: Build & publish image

# Builds the UPS monitor image multi-arch (amd64 + arm64) and pushes it to
# GitHub Container Registry. umbrelOS does not build — it only pulls this image.

on:
  push:
    branches: [master]
    paths:
      - "homelab-ups-monitor/Dockerfile"
      - "homelab-ups-monitor/watch.sh"
      - "homelab-ups-monitor/entrypoint.sh"
      - "homelab-ups-monitor/server.py"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch: {}   # lets you also trigger it manually from the Actions tab

env:
  IMAGE: ghcr.io/empewoow/homelab-ups-monitor
  VERSION: "0.6.2"        # bump this together with version in umbrel-app.yml

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write     # required to push to ghcr.io
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3        # arm64 emulation for the Pi build
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push (amd64 + arm64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./homelab-ups-monitor
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest

      - name: Print image digest (for pinning docker-compose.yml)
        run: |
          echo "Pin docker-compose.yml to:"
          echo "  ${{ env.IMAGE }}:${{ env.VERSION }}@${{ steps.build.outputs.digest }}"
